services:
  app:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////app/data/reading.db
      APP_ORIGIN: http://localhost:8000
      COOKIE_SECURE: "false"

    volumes:
      - reading_data:/app/data
      - reading_backups:/app/backups

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  reading_data:
  reading_backups:
