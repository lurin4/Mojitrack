[project]
name = "reading-site"
version = "0.1.0"
description = "Self-hosted Japanese reading tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "httpx>=0.27,<1",
  "argon2-cffi>=23.1,<26", "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.5,<3", "cachetools>=5.5,<8", "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
